  auth_variants: &auth_variants
    - name: auth-positive-standard
      description: Authentication success for test channel
      file_stub: positive_standard
      test_type: positive
      expected_result: "200"
      validation_type: status_code
    - name: auth-positive-secondary-channel
      description: Authentication success for IB channel
      file_stub: positive_alternate_channel
      test_type: positive
      expected_result: "200"
      validation_type: status_code
      test_data_bindings:
        channel: mpg_channel_alt
    - name: auth-negative-null-username
      description: Authentication null username
      file_stub: negative_null_username
      test_type: negative
      expected_result: Invalid  IP Address
      mutations:
        - op: set
          path: username
          value: null
    - name: auth-negative-whitespace-username
      description: Authentication blank username
      file_stub: negative_whitespace_username
      test_type: negative
      expected_result: Invalid  IP Address
      mutations:
        - op: set
          path: username
          value: "   "
    - name: auth-negative-too-long-username
      description: Authentication username too long
      file_stub: negative_too_long_username
      test_type: negative
      expected_result: Invalid  IP Address
      mutations:
        - op: set
          path: username
          value: this_username_is_far_too_long_for_validation_testing_1234567890
    - name: auth-negative-too-short-password
      description: Authentication password too short
      file_stub: negative_too_short_password
      test_type: negative
      expected_result: Invalid  IP Address
      mutations:
        - op: set
          path: password
          value: x
    - name: auth-negative-invalid-enum-channel
      description: Authentication invalid channel
      file_stub: negative_invalid_enum_channel
      test_type: negative
      expected_result: Invalid channel
      mutations:
        - op: set
          path: channel
          value: INVALID
    - name: auth-negative-malformed-payload
      description: Authentication malformed JSON payload
      file_stub: negative_malformed_payload
      test_type: negative
      expected_result: "JSON parse error: Cannot construct instance of `com.paysyslabs.mpg.model.request.JwtRequest`"
      mutations:
        - op: replace_root
          value: INVALID_PAYLOAD
    - name: auth-negative-unauthorized-scenario
      description: Authentication invalid password
      file_stub: negative_unauthorized_scenario
      test_type: negative
      expected_result: Invalid  IP Address
      mutations:
        - op: set
          path: password
          value: invalid_password

  batch_payment_variants: &batch_payment_variants
    - name: positive-standard
      description: "{api_label} success standard request"
      file_stub: positive_standard
      test_type: positive
      expected_result: "200"
      validation_type: status_code
    - name: positive-secondary-receiver
