      test_data_bindings:
        BatchInformation.BatchDetail.0.IBAN: IBAN_2
        BatchInformation.BatchDetail.0.IdValue: CNIC_2
    - name: negative-null-id-value
      description: "{api_label} null IdValue"
      file_stub: negative_null_id_value
      test_type: negative
      expected_result: IdValue
      mutations:
        - op: set
          path: BatchInformation.BatchDetail.0.IdValue
          value: null
    - name: negative-whitespace-tracking-id
      description: "{api_label} blank TrackingId"
      file_stub: negative_whitespace_tracking_id
      test_type: negative
      expected_result: Tracking ID limit min(24)|max(31)
      mutations:
        - op: set
          path: BatchInformation.BatchDetail.0.TrackingId
          value: "   "
    - name: negative-too-long-tracking-id
      description: "{api_label} TrackingId too long"
      file_stub: negative_too_long_tracking_id
      test_type: negative
      expected_result: Tracking ID limit min(24)|max(31)
      mutations:
        - op: set
          path: BatchInformation.BatchDetail.0.TrackingId
          value: TRACKING-ID-TOO-LONG-123456789012345678901234567890
    - name: negative-too-short-tracking-id
      description: "{api_label} TrackingId too short"
      file_stub: negative_too_short_tracking_id
      test_type: negative
      expected_result: Tracking ID limit min(24)|max(31)
      mutations:
        - op: set
          path: BatchInformation.BatchDetail.0.TrackingId
          value: T
    - name: negative-invalid-enum-id-type
      description: "{api_label} invalid IdType"
      file_stub: negative_invalid_enum_id_type
      test_type: negative
      expected_result: IdType
      mutations:
        - op: set
          path: BatchInformation.BatchDetail.0.IdType
          value: INVALID
    - name: negative-invalid-date
      description: "{api_label} invalid DateTime format"
      file_stub: negative_invalid_date
      test_type: negative
      expected_result: Date Time must be Formatted like this yyyyMMddHHmmss
      mutations:
        - op: set
          path: TransactionInfo.DateTime
          value: "2026-99-99T25:61:61"
    - name: negative-invalid-amount-format
      description: "{api_label} invalid amount format"
      file_stub: negative_invalid_amount_format
      test_type: negative
      expected_result: "JSON parse error: Cannot deserialize value of type `java.math.BigDecimal` from String \"ABC\": not a valid representation"
      mutations:
        - op: set
          path: BatchInformation.BatchDetail.0.Amount
          value: ABC
    - name: negative-duplicate-request
      description: "{api_label} duplicate RRN"
      file_stub: negative_duplicate_request
      test_type: negative
      expected_result: '404 NOT_FOUND "Batch not found"'
      mutations:
        - op: set
          path: TransactionInfo.RRN
          value: ${DUPLICATE_RRN}
    - name: negative-malformed-payload
      description: "{api_label} malformed JSON payload"
      file_stub: negative_malformed_payload
      test_type: negative
      expected_result: JSON parse error
      mutations:
        - op: replace_root
