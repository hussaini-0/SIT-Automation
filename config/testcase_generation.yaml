suites:
  - service: mpg_sender_api
    api_name: createAuthenticationTokenUsingPOST
    api_label: Authentication
    bank: bank1
    base_request_file: createAuthenticationTokenUsingPOST.json
    workbook: testcases/sit_testcases_mpg_sender_api.xlsx
    sheet: MPG_SENDER_API
    start_id: MPGTC1000
    request_prefix: mpg_auth
    expected_result: success
    validation_type: response
    trx_type: non-financial
    test_data_binding_mode: value
    test_data_bindings: *mpg_auth_bindings
    variants: *auth_variants

  - service: mpg_sender_api
    api_name: paymentUsingPOST
